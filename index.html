<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonX - Empowering Global Digital Commerce</title>
<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: #0a1931;
  color: white;
  text-align: center;
}
header {
  padding: 60px 20px;
}
header h1 {
  color: #00c6ff;
  font-size: 60px;
  margin:0;
  letter-spacing: 2px;
}
header p {
  font-size: 22px;
  margin-top: 10px;
  color: #d0d0d0;
}
.divider {
  height: 2px;
  background: linear-gradient(to right, #00c6ff, #0072ff);
}
.hero {
  padding: 80px 20px;
  background: #0f2447;
}
.hero h2 {
  font-size: 42px;
  line-height: 1.2;
  margin-bottom: 20px;
}
.hero p {
  max-width: 600px;
  margin: 0 auto 30px;
  font-size: 20px;
  color: #c5d1e0;
}
.btn {
  background: #00bfff;
  color: white;
  padding: 15px 35px;
  border: none;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
}
footer {
  padding: 20px;
  background: #060e20;
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <h1>MoonX</h1>
  <p>Empowering Global Digital Commerce</p>
</header>

<div class="divider"></div>

<div class="hero">
  <h2>Innovate. Connect.<br>Grow.</h2>
  <p>MoonX brings futuristic technology and global trade together for a smarter digital world.</p>
  <button class="btn" onclick="window.location.href='#'">Explore Now</button>
</div>

<div class="divider"></div>

<footer>
  © 2026 MoonX | All Rights Reserved
</footer>

</body>
</html>
